services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ONEBOT_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${ONEBOT_WS_PORT:-3001}:3001"
      - "${SNOWLUMA_WEBUI_PORT:-5099}:5099"
    volumes:
      - snowluma-data:/app/data
      - snowluma-config:/app/.config
      - snowluma-local-share:/app/.local/share
  qq-ai-bridge:
    build:
      context: ../integrations/qq-ai-bridge
    restart: unless-stopped
    env_file:
      - ../integrations/qq-ai-bridge/.env
    depends_on:
      - snowluma
    volumes:
      - qq-ai-bridge-data:/data
    profiles: ["ai"]
  mcp-gateway:
    build:
      context: ../mcp-gateway
    restart: unless-stopped
    env_file:
      - ../mcp-gateway/.env
    depends_on:
      - snowluma
    ports:
      - "127.0.0.1:8766:8766"
    profiles: ["mcp"]
volumes:
  snowluma-data:
  snowluma-config:
  snowluma-local-share:
  qq-ai-bridge-data:
